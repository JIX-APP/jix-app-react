workflows:
  ios-testflight:
    name: JIX iOS - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: JIX ASC Key
    environment:
      groups:
        - supabase
      node: 22
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jixapp.live
    scripts:
      - name: Install web dependencies
        script: npm install
      - name: Build web app
        script: npx vite build
      - name: Add Capacitor iOS
        script: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/ios@7
          npx cap add ios
          npx cap sync ios
      - name: Camera and microphone permissions
        script: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'JIX يحتاج الكاميرا للبث المباشر وتصوير الفيديوهات'" $PLIST
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'JIX يحتاج الميكروفون للبث المباشر والمكالمات'" $PLIST
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'JIX يحتاج الصور لاختيار صورة الحساب ورفع الفيديوهات'" $PLIST
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $PLIST
      - name: Code signing
        script: xcode-project use-profiles
      - name: Build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
